name: DEBOOG.56 browser regression
on:
  push:
    branches: [deboog56-test]
    paths: [DEBOOG.56.html, .github/workflows/deboog56-test.yml]
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/deboog56-test'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Require exact release
        run: test -f DEBOOG.56.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run independent browser assertions
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const {createServer}=require('node:http');
          const {readFileSync}=require('node:fs');
          const assert=require('node:assert/strict');
          const html=readFileSync('DEBOOG.56.html');
          const server=createServer((req,res)=>{res.writeHead(200,{'Content-Type':'text/html; charset=utf-8'});res.end(html);});
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const url='http://127.0.0.1:'+server.address().port;
            let browser;
            try{
              browser=await chromium.launch();
              const context=await browser.newContext({viewport:{width:1440,height:900},acceptDownloads:true});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              page.on('dialog',d=>d.accept());
              await page.goto(url);
              await page.locator('input[type=file]').first().waitFor({state:'attached'});
              const fixture='<html><head><title>Regression fixture</title></head><body><h1>Original heading</h1><button onclick="this.textContent=\'Clicked\'">Click me</button></body></html>';
              await page.locator('input[type=file]').first().setInputFiles({name:'regression.html',mimeType:'text/html',buffer:Buffer.from(fixture)});
              const frame=page.frameLocator('iframe[title^="Preview of "]');
              await frame.getByRole('heading',{name:'Original heading'}).waitFor();
              await frame.getByRole('button',{name:'Click me'}).click();
              await frame.getByRole('button',{name:'Clicked'}).waitFor();
              console.log('PASS HTML preview and click');
              await page.getByRole('button',{name:'Edit',exact:true}).click();
              await frame.getByRole('heading',{name:'Original heading'}).dblclick();
              const editor=frame.locator('[contenteditable=true]').first();
              await editor.fill('Edited heading');
              await editor.press('Escape');
              await frame.getByRole('heading',{name:'Edited heading'}).waitFor();
              await page.keyboard.press('Control+z');
              await frame.getByRole('heading',{name:'Original heading'}).waitFor();
              await page.keyboard.press('Control+Shift+z');
              await frame.getByRole('heading',{name:'Edited heading'}).waitFor();
              console.log('PASS edit and undo/redo');
              const download=page.waitForEvent('download');
              await page.getByRole('button',{name:'Download HTML'}).click();
              const exported=await download;
              assert.match(readFileSync(await exported.path(),'utf8'),/Edited heading/);
              console.log('PASS edited HTML export');
              const projectCount=()=>page.evaluate(async()=>{const list=await indexedDB.databases();if(!list.some(d=>d.name==='deboog56:db'))return 0;return new Promise((resolve,reject)=>{const r=indexedDB.open('deboog56:db');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result;const q=db.transaction('projects').objectStore('projects').count();q.onsuccess=()=>{db.close();resolve(q.result)};q.onerror=()=>{db.close();reject(q.error)}}})});
              for(let i=0;i<20&&!(await projectCount());i++)await new Promise(r=>setTimeout(r,500));
              assert.ok(await projectCount(),'No persisted project record');
              await page.reload();
              assert.ok(await projectCount(),'Project record lost after reload');
              console.log('PASS IndexedDB project persistence across reload');
              assert.deepEqual(errors,[]);
              console.log('PASS no uncaught host runtime errors');
            }finally{await browser?.close();server.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
