<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <title>DEBOOGER 2K</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111820; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: none; background: #111820; }
    #status { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 14px; padding: 24px; text-align: center; color: #d9e1e6; }
    #message { font-size: 14px; font-weight: 400; letter-spacing: .01em; line-height: 1.5; max-width: 420px; }
    #retry { display: none; padding: 9px 20px; background: #243642; color: #eef5f7; border: 1px solid #3a5260; border-radius: 5px; font: inherit; font-size: 14px; cursor: pointer; }
    #retry:hover { background: #314752; }
    #retry:focus-visible { outline: 2px solid #88d7cb; outline-offset: 3px; }
  </style>
</head>
<body>
  <iframe id="app" title="DEBOOGER 2K" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
  <main id="status" role="status" aria-live="polite">
    <div id="message">Opening DEBOOGER…</div>
    <button id="retry" type="button">Retry</button>
  </main>
  <script>
    (() => {
      'use strict';

      // Edit these two values only if you change the public GitHub repository.
      const GITHUB = { owner: 'izzytee1', repo: 'db', branch: 'main' };
      const CACHE_KEY = 'debooger:index:latest:v1';
      const apiUrl = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/?ref=${encodeURIComponent(GITHUB.branch)}`;
      const root = new URL('./', location.href);
      const frame = document.getElementById('app');
      const status = document.getElementById('status');
      const message = document.getElementById('message');
      const retry = document.getElementById('retry');
      let busy = false;

      // Only release HTML files are eligible. Handoffs, examples and index.html are excluded.
      function release(name) {
        const match = /^(DB|DEBOOG|DEBOOGER)[._-]?0*(\d+)(?:\s*\(\d+\))?(?:[-_](?:download|release))?\.html$/i.exec(name);
        if (!match) return null;
        const version = Number(match[2]);
        if (!Number.isSafeInteger(version)) return null;
        const currentStyle = match[1].toUpperCase() === 'DB';
        const canonical = new RegExp(`^DB\\.${String(version).padStart(2, '0')}\\.html$`, 'i').test(name);
        return { name, version, series: Number(currentStyle), canonical: Number(canonical) };
      }

      function order(files) {
        const unique = new Map();
        for (const name of files) {
          const item = release(name);
          if (item) unique.set(name, item);
        }
        return [...unique.values()].sort((a, b) => b.series - a.series || b.version - a.version || b.canonical - a.canonical || a.name.localeCompare(b.name));
      }

      function knownFile() {
        try { return release(localStorage.getItem(CACHE_KEY) || '')?.name || null; }
        catch { return null; }
      }

      function remember(name) {
        try { localStorage.setItem(CACHE_KEY, name); } catch { /* private or unavailable storage */ }
      }

      function forget() {
        try { localStorage.removeItem(CACHE_KEY); } catch { /* private or unavailable storage */ }
      }

      async function withTimeout(url, options, ms) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), ms);
        try { return await fetch(url, { ...options, signal: controller.signal }); }
        finally { clearTimeout(timeout); }
      }

      async function available(name) {
        // A HEAD probe ensures a deleted/cached old file cannot produce a blank 404 frame.
        const url = new URL(encodeURIComponent(name), root);
        url.searchParams.set('_db_probe', String(Date.now()));
        try {
          const result = await withTimeout(url.href, { method: 'HEAD', cache: 'no-store' }, 5000);
          return result.ok;
        } catch { return false; }
      }

      async function candidates() {
        let names = [];
        try {
          const response = await withTimeout(apiUrl, {
            cache: 'no-store',
            headers: { Accept: 'application/vnd.github+json' }
          }, 6500);
          if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
          const contents = await response.json();
          if (!Array.isArray(contents)) throw new Error('Repository listing unavailable');
          names = contents.filter(x => x.type === 'file' && typeof x.name === 'string').map(x => x.name);
        } catch { /* Try the last working file if GitHub is offline or rate-limited. */ }
        const cached = knownFile();
        if (cached) names.push(cached);
        return order(names);
      }

      function showError() {
        frame.style.display = 'none';
        status.style.display = 'flex';
        message.textContent = 'No published DEBOOGER release found. Upload DB.28.html (or newer) beside index.html in the repository root.';
        retry.style.display = 'block';
      }

      async function openNewest() {
        if (busy) return;
        busy = true;
        status.style.display = 'flex';
        retry.style.display = 'none';
        message.textContent = 'Opening DEBOOGER…';
        try {
          const files = await candidates();
          for (const file of files) {
            if (!await available(file.name)) {
              if (knownFile() === file.name) forget();
              continue;
            }
            const target = new URL(encodeURIComponent(file.name), root);
            target.searchParams.set('release', `${file.version}`);
            frame.onload = () => {
              remember(file.name);
              frame.style.display = 'block';
              status.style.display = 'none';
            };
            frame.src = target.href;
            return;
          }
          showError();
        } finally { busy = false; }
      }

      retry.addEventListener('click', openNewest);
      openNewest();
    })();
  </script>
</body>
</html>
