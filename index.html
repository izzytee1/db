<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fb">
<title>DEBOOGER 2K</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f9fb}
  iframe{display:block;position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#f7f9fb}
</style>
</head>
<body>
<iframe id="app" title="DEBOOGER 2K" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  const key = 'debooger-db-router-last-file-v1';
  const defaultFile = 'DB23-download.html';
  const parse = name => {
    const match = /^DB\.?([0-9]+)(?:-download)?\.html$/i.exec(name);
    if (!match) return null;
    const version = Number(match[1]);
    return Number.isSafeInteger(version) ? { name, version, canonical: /^DB\.[0-9]+\.html$/i.test(name) } : null;
  };
  const filename = name => typeof name === 'string' && parse(name) ? name : null;
  let remembered;
  try { remembered = filename(localStorage.getItem(key)); } catch (_) { /* Storage optional. */ }
  let current = remembered || defaultFile;
  const pathFor = name => './' + encodeURIComponent(name);
  // Begin opening the known file immediately; do not block on GitHub's API.
  frame.src = pathFor(current);
  const remember = name => { try { localStorage.setItem(key, name); } catch (_) {} };
  const check = async name => {
    try {
      const response = await fetch(pathFor(name), { method: 'HEAD', cache: 'no-store' });
      return response.ok;
    } catch (_) { return false; }
  };
  (async () => {
    let candidates = [];
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 4000);
    try {
      const response = await fetch('https://api.github.com/repos/izzytee1/db/contents/', {
        signal: controller.signal, cache: 'no-store',
        headers: { Accept: 'application/vnd.github+json' }
      });
      if (response.ok) {
        const files = await response.json();
        if (Array.isArray(files)) candidates = files
          .filter(file => file.type === 'file')
          .map(file => parse(file.name)).filter(Boolean);
      }
    } catch (_) { /* Continue opening the last known working file. */ }
    finally { clearTimeout(timer); }
    candidates.sort((a,b) => b.version - a.version || Number(b.canonical) - Number(a.canonical));
    const preferred = candidates[0];
    if (preferred && preferred.name !== current && await check(preferred.name)) {
      current = preferred.name;
      remember(current);
      frame.src = pathFor(current);
    } else if (await check(current)) {
      remember(current);
    } else {
      // A previously saved name was removed; try known versions without a 404 redirect.
      const fallbacks = [defaultFile, 'DB.23.html', ...candidates.map(c => c.name)];
      for (const name of [...new Set(fallbacks)]) {
        if (name !== current && await check(name)) {
          current = name;
          remember(current);
          frame.src = pathFor(current);
          break;
        }
      }
    }
  })();
})();
</script>
</body>
</html>
