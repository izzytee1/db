<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEBOOGER</title>
<style>html,body{margin:0;min-height:100%;background:#fff}</style>
<script>
'use strict';
(async () => {
  // Permanent router. Render the newest release at the short URL; never redirect or copy the app here.
  const base = new URL('./', location.href);
  const parts = base.pathname.split('/').filter(Boolean);
  const owner = location.hostname.split('.')[0];
  const repo = parts[0] || '';
  const pattern = /^DB\.(\d+)\.html$/i;
  const storeKey = 'db-router:' + owner + '/' + repo;
  const knownRelease = 'DB.39.html'; // Used only when discovery and the last-known release both fail.
  let saved = '';
  try {
    const previous = localStorage.getItem(storeKey);
    if (pattern.test(previous || '')) saved = previous;
  } catch (_) {}

  const pending = new Map();
  function readRelease(filename) {
    if (!pattern.test(filename)) return Promise.reject(Error('Invalid release filename'));
    if (!pending.has(filename)) {
      const path = new URL(encodeURIComponent(filename), base);
      pending.set(filename, fetch(path, { cache: 'no-store' }).then(response => {
        if (!response.ok) throw Error('Release unavailable: ' + filename);
        return response.text();
      }).then(html => {
        if (!/^\s*<!doctype html|^\s*<html\b/i.test(html)) throw Error('Invalid release content: ' + filename);
        return html;
      }));
    }
    return pending.get(filename);
  }
  if (saved) readRelease(saved).catch(() => {}); // Prepare the most recent version while discovering releases.

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 1600);
  let versions = [];
  try {
    if (repo && owner) {
      const response = await fetch('https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contents?ref=main', {
        headers: { Accept: 'application/vnd.github+json' },
        cache: 'no-store',
        signal: controller.signal
      });
      if (!response.ok) throw Error('Version discovery unavailable');
      const entries = await response.json();
      if (!Array.isArray(entries)) throw Error('Invalid version listing');
      versions = entries.filter(entry => entry && entry.type === 'file' && pattern.test(entry.name))
        .map(entry => entry.name)
        .sort((a, b) => Number(b.match(pattern)[1]) - Number(a.match(pattern)[1]));
    }
  } catch (_) {
    // GitHub API may be unavailable or rate-limited; use the last working release.
  } finally {
    clearTimeout(timeout);
  }

  const candidates = [...new Set([...versions, saved, knownRelease].filter(name => pattern.test(name || '')))];
  for (const filename of candidates) {
    try {
      const html = await readRelease(filename);
      try { localStorage.setItem(storeKey, filename); } catch (_) {}
      // When visiting /db/index.html directly, normalize it to /db/.
      if (location.pathname !== base.pathname) {
        try { history.replaceState(history.state, '', base.pathname + location.search + location.hash); } catch (_) {}
      }
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (_) {}
  }

  document.body.textContent = 'Unable to open DEBOOGER. Check your connection and confirm a DB.##.html file is published.';
  document.body.style.cssText = 'font:16px system-ui,sans-serif;padding:24px;color:#344054';
})();
</script>
</head>
<body></body>
</html>
