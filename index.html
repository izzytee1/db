<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>DEBOOGER 2K</title>
  <style>
    :root { color-scheme:light; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { min-height:100dvh; display:grid; place-items:center; margin:0; padding:24px; background:#f7f9fb; color:#263238; }
    main { width:min(420px,100%); padding:30px; border:1px solid #e0e7ec; border-radius:13px; background:#fff; box-shadow:0 12px 40px #172b4310; text-align:center; }
    h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.035em; }
    h1 span { color:#087f6e; }
    p { margin:16px 0; color:#607179; font-size:14px; line-height:1.5; }
    a { color:#087f6e; font-weight:500; }
    .spinner { width:24px; height:24px; border:2px solid #ddebe6; border-top-color:#087f6e; border-radius:50%; margin:21px auto 0; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(prefers-reduced-motion:reduce){.spinner{animation:none;}}
  </style>
</head>
<body>
  <main>
    <h1>DEBOOGER <span>2K</span></h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status" role="status">Opening the latest version…</p>
    <a id="fallback-link" href="./DB.23.html">Open DB.23 manually</a>
  </main>
  <script>
    // Permanent GitHub Pages entry: choose the highest DB.NN.html in the repo root.
    // Upload future versions with their original names; never rename an app to index.html.
    (async () => {
      const fallback = 'DB.23.html';
      const status = document.getElementById('status');
      const link = document.getElementById('fallback-link');
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3500);
      let destination = fallback;
      try {
        const response = await fetch('https://api.github.com/repos/izzytee1/db/contents/', {
          cache: 'no-store',
          signal: controller.signal,
          headers: { Accept: 'application/vnd.github+json' }
        });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const entries = await response.json();
        if (!Array.isArray(entries)) throw new Error('Unexpected repository response');
        const versions = entries
          .filter(item => item.type === 'file' && /^DB\.(\d+)\.html$/i.test(item.name))
          .map(item => ({ name: item.name, version: Number(item.name.match(/^DB\.(\d+)\.html$/i)[1]) }))
          .filter(item => Number.isSafeInteger(item.version))
          .sort((a, b) => b.version - a.version);
        if (versions.length) destination = versions[0].name;
      } catch (error) {
        status.textContent = 'Opening the saved version…';
      } finally {
        clearTimeout(timeout);
      }
      // Only numeric version filenames from the repository are accepted.
      link.href = './' + encodeURIComponent(destination);
      link.textContent = `Open ${destination} manually`;
      window.location.replace(link.href);
    })();
  </script>
</body>
</html>
