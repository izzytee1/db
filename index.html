<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DEBOOGER</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff}</style>
<script>
'use strict';
(() => {
  // Permanent GitHub Pages router. No splash, iframe, or copied app.
  const owner = location.hostname.split('.')[0];
  const pieces = location.pathname.split('/').filter(Boolean);
  const repo = pieces[0] || '';
  const home = '/' + (repo ? repo + '/' : '');
  const versionPattern = /^DB\.(\d+)\.html$/i;
  const cacheKey = 'db-router:' + owner + '/' + repo;
  const defaultFile = 'DB.34.html';
  const valid = name => typeof name === 'string' && versionPattern.test(name);
  function navigate(name) {
    const target = home + encodeURIComponent(valid(name) ? name : defaultFile) + location.search + location.hash;
    location.replace(target);
  }
  let fallback = defaultFile;
  try { const old = localStorage.getItem(cacheKey); if (valid(old)) fallback = old; } catch (_) {}
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 1400);
  fetch('https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contents?ref=main', {
    headers: { Accept: 'application/vnd.github+json' },
    cache: 'no-store',
    signal: controller.signal
  }).then(r => { if (!r.ok) throw Error('Repository unavailable'); return r.json(); })
    .then(items => {
      if (!Array.isArray(items)) throw Error('Invalid listing');
      const found = items.filter(item => item && item.type === 'file' && valid(item.name))
        .sort((a,b) => Number(b.name.match(versionPattern)[1]) - Number(a.name.match(versionPattern)[1]));
      const latest = found.length ? found[0].name : fallback;
      try { localStorage.setItem(cacheKey, latest); } catch (_) {}
      navigate(latest);
    })
    .catch(() => navigate(fallback))
    .finally(() => clearTimeout(timeout));
})();
</script>
</head>
<body></body>
</html>
