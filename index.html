<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEBOOGER</title>
<link rel="preconnect" href="https://api.github.com" crossorigin>
<script>
'use strict';
(async () => {
  // Permanent router. Render the newest release at the short URL; never redirect or copy the app here.
  const base = new URL('./', location.href);
  const parts = base.pathname.split('/').filter(Boolean);
  const owner = location.hostname.split('.')[0];
  const repo = parts[0] || '';
  const pattern = /^DEBOOG\.(\d+)\.html$/i;
  const storeKey = 'deboog-router:' + owner + '/' + repo;
  const knownRelease = 'DEBOOG.22.html'; // Used only when discovery and the last-known release both fail.
  let saved = '';
  try {
    const previous = localStorage.getItem(storeKey);
    if (pattern.test(previous || '')) saved = previous;
  } catch (_) {}

  const pending = new Map();
  function readRelease(filename) {
    if (!pattern.test(filename)) return Promise.reject(Error('Invalid release filename'));
    if (!pending.has(filename)) {
      const path = new URL(encodeURIComponent(filename), base);
      pending.set(filename, fetch(path, { cache: 'no-cache', priority: 'high' }).then(response => {
        if (!response.ok) throw Error('Release unavailable: ' + filename);
        return response.text();
      }).then(html => {
        if (!/^\s*<!doctype html|^\s*<html\b/i.test(html)) throw Error('Invalid release content: ' + filename);
        return html;
      }));
    }
    return pending.get(filename);
  }
  // Start discovery and the last known download together. Revalidate cached responses.
  const discovery = (async () => {
    try {
      if (!repo || !owner || !/\.github\.io$/i.test(location.hostname)) return [];
      const response = await fetch('https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) + '/contents?ref=main', {
        headers: { Accept: 'application/vnd.github+json' },
        cache: 'no-cache',
        priority: 'high'
      });
      if (!response.ok) return [];
      const entries = await response.json();
      if (!Array.isArray(entries)) return [];
      return entries.filter(entry => entry && entry.type === 'file' && pattern.test(entry.name))
        .map(entry => entry.name);
    } catch (_) {
      return [];
    }
  })();
  const fallback = [saved, knownRelease].filter(Boolean)
    .sort((a, b) => Number(b.match(pattern)[1]) - Number(a.match(pattern)[1]))[0];
  readRelease(fallback).catch(() => {});
  const versions = await discovery;

  const candidates = [...new Set([...versions, saved, knownRelease].filter(name => pattern.test(name || '')))]
    .sort((a, b) => Number(b.match(pattern)[1]) - Number(a.match(pattern)[1]));
  for (const filename of candidates) {
    try {
      const html = await readRelease(filename);
      try { localStorage.setItem(storeKey, filename); } catch (_) {}
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (_) {}
  }

  console.error('DEBOOGER could not load a published DEBOOG.##.html release.');
})();
</script>
</head>
<body></body>
</html>
